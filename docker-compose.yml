  services:
    backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      restart: always
      volumes:
        - ./backend:/code
      env_file: ./backend/.env
      command: >
        sh -c "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
      healthcheck:
        test: [
          "CMD", "python", "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
        ]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 10s
      networks:
        - recruiter

    frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      # restart: always
      volumes:
        - ./frontend:/app
      env_file: ./frontend/.env
      depends_on:
        - backend
      networks:
        - recruiter

    nginx:
      image: nginx:alpine
      restart: always
      ports:
        - 8000:80
      volumes:
        - ./nginx/conf.d:/etc/nginx/conf.d
        - ./frontend/dist:/usr/share/nginx/html
      depends_on:
        backend:
          condition: service_healthy
        frontend:
          condition: service_started
      healthcheck:
        test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 10s
      networks:
        - recruiter

  networks:
    recruiter:
      name: recruiter
      driver: bridge
